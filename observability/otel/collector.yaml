# Single collector, two pipelines: traces to Tempo, metrics exposed for
# Prometheus to scrape. Having a collector is what lets the services push metrics
# over OTLP without each one needing to run its own HTTP /metrics server - most
# of these services are gRPC/TCP/Kafka only and have no HTTP listener.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Promotes OTel resource attributes (service.name etc.) into Prometheus
    # labels, so metrics are queryable per service.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
