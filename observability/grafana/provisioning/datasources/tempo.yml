apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      # Jump from a span straight to the Loki logs for that service and window -
      # this is why both datasources carry explicit uids.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      # Service graph / node graph are built from the span metrics Prometheus stores.
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
