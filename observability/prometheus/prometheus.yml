global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The app metrics all arrive at the collector over OTLP; Prometheus scrapes
  # the collector's Prometheus exporter rather than each service.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
