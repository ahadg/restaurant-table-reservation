name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build all Nest applications
        run: |
          for project in api-gateway auth-service restaurant-service table-service reservation-service notification-service email-service; do
            npm run build -- "$project"
          done
