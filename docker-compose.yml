services:
  postgres:
    image: postgres:17
    container_name: restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant_password
      POSTGRES_DB: restaurant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.1
    container_name: restaurant-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    restart: unless-stopped
    # AOF keeps idempotency keys across restarts; they are TTL-scoped anyway.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Log store. The NestJS services run on the host (npm run start:dev), not in
  # Docker, so they push their logs here over the HTTP API - see libs/loki.
  loki:
    image: grafana/loki:3.3.2
    container_name: restaurant-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: restaurant-grafana
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Handy while developing; remove if you expose Grafana beyond localhost.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource is provisioned so the UI works on first boot.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  # Trace store. Receives OTLP from the collector and serves the query API the
  # Grafana Tempo datasource reads.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: restaurant-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  # Receives OTLP from the services (4317 gRPC / 4318 HTTP), forwards traces to
  # Tempo, and exposes a Prometheus endpoint for metrics. The collector exists so
  # services can push metrics over OTLP without each needing its own HTTP
  # /metrics server - most of them are gRPC/TCP/Kafka only.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: restaurant-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - tempo
    volumes:
      - ./observability/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Published because the services run on the host, not on this network.
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: restaurant-prometheus
    restart: unless-stopped
    depends_on:
      - otel-collector
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
  tempo_data:
  prometheus_data:
